<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>Tilbud Radar</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand__logo">🏷️</span>
      <div>
        <h1>Tilbud Radar</h1>
        <p>כל המבצעים של רשתות הסופרמרקטים בדנמרק – לפי המיקום שלך</p>
      </div>
    </div>

    <form id="locationForm" class="location" autocomplete="off">
      <div class="location__field">
        <input id="addressInput" type="text" placeholder="כתובת, מיקוד, קואורדינטות או קישור מפות…" aria-label="כתובת" />
        <ul id="addressSuggestions" class="suggestions" hidden></ul>
      </div>
      <button type="button" id="gpsBtn" class="btn btn--ghost" title="השתמש במיקום שלי">📍 מיקום שלי</button>
      <select id="radiusSelect" aria-label="רדיוס">
        <option value="1000">1 ק״מ</option>
        <option value="2000">2 ק״מ</option>
        <option value="5000" selected>5 ק״מ</option>
        <option value="10000">10 ק״מ</option>
        <option value="25000">25 ק״מ</option>
      </select>
    </form>
    <div id="locationStatus" class="location__status"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="compare" role="tab">🔍 השוואת מחירים</button>
    <button class="tab" data-tab="deals" role="tab">🏷️ כל המבצעים</button>
    <button class="tab" data-tab="catalogs" role="tab">📰 עלונים</button>
    <button class="tab" data-tab="list" role="tab">🛒 רשימת קניות</button>
  </nav>

  <main>
    <!-- Compare -->
    <section id="tab-compare" class="panel is-active">
      <form id="searchForm" class="searchbar">
        <input id="searchInput" type="search" placeholder="חפשו מוצר בדנית, למשל: kaffe, mælk, smør…" />
        <button class="btn" type="submit">חיפוש</button>
      </form>
      <div id="quickChips" class="chips"></div>
      <div class="toolbar">
        <label>מיון:
          <select id="compareSort">
            <option value="unit">מחיר ליחידה (ק״ג/ליטר)</option>
            <option value="price">מחיר</option>
            <option value="savings">הנחה הכי גדולה</option>
            <option value="dealer">רשת</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="cheapestPerChain" /> הזול ביותר בכל רשת</label>
        <span id="compareCount" class="muted"></span>
      </div>
      <div id="compareDealerChips" class="chips chips--dealers"></div>
      <div id="compareResults" class="grid"></div>
    </section>

    <!-- All deals -->
    <section id="tab-deals" class="panel">
      <div class="toolbar">
        <input id="dealsFilter" type="search" placeholder="סינון מהיר בתוך המבצעים…" />
        <label>מיון:
          <select id="dealsSort">
            <option value="popular">פופולרי</option>
            <option value="savings">הנחה הכי גדולה</option>
            <option value="price">מחיר</option>
            <option value="unit">מחיר ליחידה</option>
          </select>
        </label>
        <span id="dealsCount" class="muted"></span>
      </div>
      <div id="dealsDealerChips" class="chips chips--dealers"></div>
      <div id="dealsResults" class="grid"></div>
      <div class="center"><button id="dealsMore" class="btn btn--ghost" hidden>טען עוד מבצעים</button></div>
    </section>

    <!-- Catalogs -->
    <section id="tab-catalogs" class="panel">
      <div id="catalogResults" class="catalogs"></div>
    </section>

    <!-- Shopping list -->
    <section id="tab-list" class="panel">
      <form id="listForm" class="searchbar">
        <input id="listInput" type="text" placeholder="הוסיפו מוצר לרשימה (בדנית), למשל: kaffe" />
        <button class="btn" type="submit">הוספה</button>
      </form>
      <ul id="listItems" class="list"></ul>
      <div class="center"><button id="listCompare" class="btn">השוואת הסל בכל הרשתות</button></div>
      <div id="listResults"></div>
    </section>
  </main>

  <dialog id="viewer" class="viewer">
    <div class="viewer__bar">
      <strong id="viewerTitle"></strong>
      <span id="viewerPage" class="muted"></span>
      <button class="btn btn--ghost" id="viewerClose" aria-label="סגירה">✕</button>
    </div>
    <div class="viewer__body">
      <button class="viewer__nav" id="viewerPrev" aria-label="הקודם">›</button>
      <img id="viewerImg" alt="" />
      <button class="viewer__nav" id="viewerNext" aria-label="הבא">‹</button>
    </div>
    <div id="viewerThumbs" class="viewer__thumbs"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
